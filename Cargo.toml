[workspace]
resolver = "2"
members = ["crates/import", "crates/engine", "crates/tui", "crates/gui", "dev-tools/simtool"]

# Debug builds are far too slow to simulate seasons (about 10 s a season against 0.5 s in release), so the
# simulation and the libraries it uses are optimised even in `cargo run` and `cargo test`. The other crates stay
# plain debug. Set the engine's opt-level to 1 (or remove its block) when stepping through its code in a debugger.
[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.engine]
opt-level = 3
